<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Compétences</title>
    <link rel="stylesheet" href="competence.css">
    <style>
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 100;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
        }
        
        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #4a9eff;
        }
        
        .subtitle {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #ccc;
        }
        
        .instruction {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }
        
        .ground {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.5), transparent);
            z-index: 50;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mes Compétences</h1>
        <div class="subtitle">Langages et logiciels explorés</div>
        <div class="instruction">Cliquez sur les logos pour en savoir plus</div>
    </div>
    <div class="ground"></div>
    <script src="competence.js"></script>
</body>
</html>
